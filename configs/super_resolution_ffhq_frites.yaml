conditioning:
  method: forward_sde
  params:
    sigma_y: 0.05   # must match measurement.noise.sigma
    N_gd: 10
    lr: 0.05
  initializer:
    method: lgd
    params:
      scale: 30.0
      lambda: 0.001
    # method: ps
    # params:
    #   scale: 1.0

data:
  name: general
  root: ./data/ffhq_1k_samples

measurement:
  operator:
    name: super_resolution
    in_shape: !!python/tuple [1, 3, 256, 256]
    scale_factor: 4
  noise:
    name: gaussian
    sigma: 0.05

params:
  dt: 0.01
  K: 100
  n_ddim: 20
  eta: 0.0
  warm_start_steps: 500