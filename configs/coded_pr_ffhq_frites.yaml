conditioning:
  method: forward_sde
  params:
    simga_y: 0.05   # must match measurement.noise.sigma
    N_gd: 5
    lr: 0.05
  nonunique_color: False
  initializer:
    method: ps
    params:
      scale: 0.8
    # method: lgd
    # params:
    #   scale: 400.
    #   lambda: 0.001

data:
  name: general
  root: ./data/ffhq_5_samples
  # Uncomment the following and change the root therein to initialize with given images (e.g. outputs of LGD-MC)
  # init_config:
  #   name: general
  #   root: ./results/coded_pr/recon/

measurement:
  operator:
    name: coded_pr
    oversample: 4.0

  noise: 
    name: gaussian
    sigma: 0.05